<style>
:root{--bg:#0f0f0f;--surface:#1a1a1a;--surface2:#222;--border:#2e2e2e;--accent:#e8ff47;--accent2:#ff6b35;--text:#f0f0f0;--muted:#777;--done:#3a3a1a;--done-border:#7a8a00;--red:#3a1a1a;--red-b:#ef5350;--green:#1a3a1a;--green-b:#4caf50;--blue:#1a1a3a;--blue-b:#5c9bff}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;padding-bottom:80px}
button{font-family:'DM Sans',sans-serif}
.hdr{background:#111;border-bottom:3px solid var(--accent);padding:16px 16px 12px;position:sticky;top:0;z-index:100}
.hdr-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.logo{font-family:'Bebas Neue',cursive;font-size:1.9rem;color:var(--accent);letter-spacing:2px;line-height:1}
.logo small{display:block;font-family:'DM Sans',sans-serif;font-size:0.7rem;color:var(--muted);letter-spacing:3px;text-transform:uppercase;font-weight:300}
.day-tabs{display:flex;gap:6px}
.dtab{flex:1;padding:9px 4px;border:2px solid var(--border);background:transparent;color:var(--muted);font-family:'Bebas Neue',cursive;font-size:1.05rem;letter-spacing:1px;cursor:pointer;border-radius:2px;transition:all .15s;text-align:center}
.dtab:hover{border-color:var(--accent);color:var(--accent)}
.dtab.active{background:var(--accent);border-color:var(--accent);color:#0f0f0f}
.main{padding:16px}
.vtabs{display:flex;gap:6px;margin-bottom:16px}
.vtab{flex:1;padding:8px 4px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:0.72rem;letter-spacing:2px;text-transform:uppercase;cursor:pointer;border-radius:2px;transition:all .15s;text-align:center}
.vtab:hover{border-color:var(--accent2);color:var(--accent2)}
.vtab.active{border-color:var(--accent);color:var(--accent);background:#1f1f00}
.start-card{background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:18px;margin-bottom:14px}
.readiness-row{display:flex;gap:6px;margin-bottom:4px}
.r-btn{flex:1;padding:8px 2px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:0.8rem;cursor:pointer;border-radius:2px;transition:all .15s;text-align:center}
.r-btn.sel{border-color:var(--accent);color:var(--accent);background:#1f1f00}
.timer-bar{background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.timer-disp{font-family:'Bebas Neue',cursive;font-size:2.1rem;color:var(--accent);letter-spacing:2px}
.timer-disp.warn{color:var(--accent2)}
.tbtn{background:var(--accent);color:#0f0f0f;border:none;padding:9px 18px;font-family:'Bebas Neue',cursive;font-size:1.05rem;letter-spacing:1px;cursor:pointer;border-radius:2px}
.tbtn.running{background:var(--accent2)}
.prog-wrap{margin-bottom:14px}
.prog-lbl{display:flex;justify-content:space-between;font-size:0.7rem;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.prog-bar{height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.prog-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .4s}
.ex-card{background:var(--surface);border:1px solid var(--border);border-radius:4px;margin-bottom:10px;overflow:hidden}
.ex-card.done{background:var(--done);border-color:var(--done-border)}
.ex-card.optional-ex{border-style:dashed}
.ex-hdr{padding:13px 14px;display:flex;align-items:center;gap:10px;cursor:pointer}
.ex-num{font-family:'Bebas Neue',cursive;font-size:1.3rem;color:var(--muted);width:22px;flex-shrink:0}
.ex-card.done .ex-num{color:var(--done-border)}
.ex-inf{flex:1}
.ex-name{font-weight:600;font-size:0.92rem;margin-bottom:1px}
.ex-card.done .ex-name{text-decoration:line-through;color:var(--muted)}
.ex-meta{font-size:0.72rem;color:var(--muted);letter-spacing:.5px}
.ex-tag{font-size:0.62rem;padding:2px 7px;background:var(--surface2);border-radius:20px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;border:1px solid var(--border);white-space:nowrap;flex-shrink:0}
.ex-card.done .ex-tag{background:var(--done-border);color:#0f0f0f;border-color:var(--done-border)}
.ruck-badge{font-size:0.6rem;padding:2px 6px;background:#1a1a00;border:1px solid #5a5a00;border-radius:20px;color:#aaa800;margin-left:4px;vertical-align:middle}
.ex-body{padding:0 14px 13px;display:none}
.ex-body.open{display:block}
.form-block{background:var(--surface2);border:1px solid var(--border);border-radius:3px;padding:11px;margin-bottom:10px}
.form-title{font-size:0.68rem;color:var(--accent2);letter-spacing:2px;text-transform:uppercase;margin-bottom:6px;font-weight:600}
.form-cue{font-size:0.75rem;color:var(--muted);line-height:1.6;margin-bottom:4px}
.form-cue strong{color:var(--text);font-weight:600}
.tempo-badge{display:inline-block;background:#1a1a00;border:1px solid var(--accent);color:var(--accent);font-size:0.65rem;padding:2px 8px;border-radius:20px;letter-spacing:1px;margin-bottom:8px;font-family:'Bebas Neue',cursive}
.mistake-row{margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
.mistake-title{font-size:0.65rem;color:var(--red-b);letter-spacing:2px;text-transform:uppercase;margin-bottom:4px}
.wt-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;background:var(--surface2);border:1px solid var(--border);border-radius:3px;padding:9px 11px}
.wt-left{flex:1}
.wt-lbl{font-size:0.68rem;color:var(--muted);letter-spacing:2px;text-transform:uppercase}
.wt-prev{font-size:0.67rem;color:var(--muted);margin-top:3px;font-style:italic}
.wt-ctrl{display:flex;align-items:center;gap:6px}
.wadj{width:30px;height:30px;border-radius:3px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
.wadj:hover{border-color:var(--accent);color:var(--accent)}
.wval{font-family:'Bebas Neue',cursive;font-size:1.4rem;color:var(--accent);min-width:50px;text-align:center;letter-spacing:1px}
.wunit{font-size:0.67rem;color:var(--muted);text-align:center}
.feel-row{display:flex;gap:5px;margin-bottom:8px}
.fbtn{flex:1;padding:6px 2px;border-radius:3px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:0.68rem;cursor:pointer;letter-spacing:.5px;text-align:center;transition:all .15s}
.fbtn.light.sel{background:var(--green);border-color:var(--green-b);color:var(--green-b)}
.fbtn.perfect.sel{background:#1a2a3a;border-color:var(--accent);color:var(--accent)}
.fbtn.heavy.sel{background:var(--red);border-color:var(--red-b);color:var(--red-b)}
.reps-row{display:flex;gap:5px;margin-bottom:10px}
.repbtn{flex:1;padding:6px 4px;border-radius:3px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:0.68rem;cursor:pointer;text-align:center;transition:all .15s}
.repbtn.sel{border-color:var(--accent2);color:var(--accent2);background:#2a1500}
.swap-btn{width:100%;padding:7px;background:transparent;border:1px solid var(--border);color:var(--muted);font-size:0.72rem;cursor:pointer;border-radius:2px;margin-bottom:8px;letter-spacing:1px;transition:all .15s}
.swap-btn:hover{border-color:var(--accent2);color:var(--accent2)}
.swap-panel{background:var(--surface2);border:1px solid var(--border);border-radius:3px;padding:11px;margin-bottom:8px}
.swap-ttl{font-size:0.68rem;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:9px}
.swap-opt{display:block;width:100%;text-align:left;padding:9px 11px;background:var(--surface);border:1px solid var(--border);border-radius:3px;color:var(--text);font-size:0.82rem;cursor:pointer;margin-bottom:5px;transition:all .15s;font-family:'DM Sans',sans-serif}
.swap-opt:hover{border-color:var(--accent);color:var(--accent)}
.swap-opt small{display:block;font-size:0.68rem;color:var(--muted);margin-top:2px}
.swap-cancel{display:block;width:100%;padding:7px;background:transparent;border:1px dashed var(--border);color:var(--muted);font-size:0.72rem;cursor:pointer;border-radius:2px;margin-top:3px;font-family:'DM Sans',sans-serif}
.sets-row{display:flex;gap:7px;margin-bottom:9px}
.sbt{width:40px;height:40px;border-radius:3px;border:2px solid var(--border);background:transparent;color:var(--muted);font-family:'Bebas Neue',cursive;font-size:1.05rem;cursor:pointer;transition:all .15s}
.sbt.done-s{background:var(--accent);border-color:var(--accent);color:#0f0f0f}
.mark-btn{width:100%;padding:9px;background:transparent;border:1px dashed var(--border);color:var(--muted);font-size:0.78rem;cursor:pointer;border-radius:2px;letter-spacing:1px;transition:all .15s}
.mark-btn:hover{border-color:var(--accent);color:var(--accent)}
.ex-card.done .mark-btn,.ex-card.done .swap-btn{display:none}
.sec-hdr{font-family:'Bebas Neue',cursive;font-size:1.2rem;letter-spacing:2px;color:var(--muted);margin:22px 0 4px;text-transform:uppercase}
.sec-sub{font-size:0.7rem;color:var(--muted);margin-bottom:12px;letter-spacing:.5px}
.bonus-card{background:var(--surface);border:1px solid var(--border);border-radius:4px;margin-bottom:8px;overflow:hidden}
.bonus-card.b-open{border-color:var(--accent2)}
.bonus-card.b-done{background:var(--done);border-color:var(--done-border)}
.b-hdr{padding:11px 14px;display:flex;align-items:center;gap:9px;cursor:pointer}
.b-icon{font-size:1.1rem}
.b-inf{flex:1}
.b-name{font-weight:600;font-size:0.87rem}
.bonus-card.b-done .b-name{text-decoration:line-through;color:var(--muted)}
.b-desc{font-size:0.7rem;color:var(--muted);margin-top:1px}
.b-tag{font-size:0.62rem;padding:2px 7px;border-radius:20px;border:1px solid var(--border);color:var(--muted);text-transform:uppercase;letter-spacing:1px;white-space:nowrap}
.bonus-card.b-done .b-tag{background:var(--done-border);color:#0f0f0f;border-color:var(--done-border)}
.b-body{padding:0 14px 13px;display:none}
.b-body.open{display:block}
.b-log-btn{width:100%;padding:9px;background:var(--accent2);border:none;color:#fff;font-family:'Bebas Neue',cursive;font-size:1.05rem;letter-spacing:2px;cursor:pointer;border-radius:2px}
.bonus-card.b-done .b-log-btn{display:none}
.done-banner{display:none;background:linear-gradient(135deg,#2a2a00,#1a1a00);border:2px solid var(--accent);border-radius:4px;padding:18px;text-align:center;margin-top:14px}
.done-banner.show{display:block}
.done-banner h2{font-family:'Bebas Neue',cursive;font-size:1.8rem;color:var(--accent);letter-spacing:3px;margin-bottom:5px}
.done-banner p{color:var(--muted);font-size:0.82rem}
.log-btn{background:var(--accent);border:none;padding:11px 28px;font-family:'Bebas Neue',cursive;font-size:1.15rem;letter-spacing:2px;cursor:pointer;border-radius:2px;margin-top:12px}
.hist-session{background:var(--surface);border:1px solid var(--border);border-radius:4px;margin-bottom:12px;overflow:hidden}
.hist-hdr{padding:12px 14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;border-bottom:1px solid var(--border)}
.hist-date{font-family:'Bebas Neue',cursive;font-size:1.1rem;letter-spacing:2px;color:var(--accent)}
.hist-meta{font-size:0.7rem;color:var(--muted)}
.hist-body{padding:12px 14px;display:none}
.hist-body.open{display:block}
.hist-ex-row{display:flex;justify-content:space-between;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--border)}
.hist-ex-row:last-child{border-bottom:none}
.hist-ex-name{font-size:0.82rem;font-weight:500}
.hist-ex-detail{font-size:0.72rem;color:var(--muted);margin-top:2px}
.hist-wt{font-family:'Bebas Neue',cursive;font-size:1.1rem;color:var(--accent);letter-spacing:1px}
.hist-feel{font-size:0.65rem;margin-top:2px}

// ─── STATE ────────────────────────────────────────────────────────────────────
function newState(){return{sessions:[],currentDay:null,activeSession:null,view:'workout',openEx:null,openSwap:null,openBonus:null,openHistIdx:null,_pr:null,gainsMode:false,defaultSwaps:{}}}
function load(){try{const r=localStorage.getItem(SK);return r?JSON.parse(r):null}catch{return null}}
function save(){localStorage.setItem(SK,JSON.stringify(S))}
let S=load()||newState();
if(!S.defaultSwaps)S.defaultSwaps={};
if(S.gainsMode===undefined)S.gainsMode=false;
if(!S.ruckLogs)S.ruckLogs=[];
if(!S._ruckDraft)S._ruckDraft={tags:[]};
if(!S._postQDraft)S._postQDraft={};
if(!S.weightLogs)S.weightLogs=[];
if(!S.moreView)S.moreView='weight';
if(S.bodyIndexFilter===undefined)S.bodyIndexFilter=null;
// If a session's timer was left running when the app was last closed, freeze it at that point
// rather than letting it keep counting real-world time while the app was closed.
if(S.activeSession&&S.activeSession.timerStart){
  S.activeSession.timerElapsed=(S.activeSession.timerElapsed||0)+Math.floor((Date.now()-S.activeSession.timerStart)/1000);
  S.activeSession.timerStart=null;
  save();
}
let timerIv=null;

// ─── HELPERS ──────────────────────────────────────────────────────────────────
function getLog(){return S.activeSession?S.activeSession.log:{}}
function setLog(k,v){if(S.activeSession){S.activeSession.log[k]=v;save()}}
function getSessionsForDay(day){return(S.sessions||[]).filter(s=>s.day===day).sort((a,b)=>new Date(b.date)-new Date(a.date))}
function getLastSession(day){const a=getSessionsForDay(day);return a.length?a[0]:null}
function getEffEx(day,idx){
  const log=getLog();const base=DB[day].exercises[idx];
  const sessionSwap=log[`ex${idx}_swap`];
  let swapId;
  if(sessionSwap==='_base_')swapId=null;
  else if(sessionSwap!==undefined)swapId=sessionSwap;
  else swapId=(S.defaultSwaps&&S.defaultSwaps[day]&&S.defaultSwaps[day][base.id])||null;
  if(!swapId)return applyGains(base,true);
  const found=(DB[day].swaps[base.id]||[]).find(s=>s.id===swapId);
  return found?applyGains({...base,name:found.name,reps:found.reps,dw:found.dw,tip:found.note,muscles:found.muscles||base.muscles,cues:[],mistakes:[],_swapped:true},false):applyGains(base,true);
}
// In Gains Mode, show 6-8 reps instead of the normal rep range
function applyGains(ex,isBase){
  if(!S.gainsMode||ex.dw<=0)return ex;
  return{...ex,reps:'6–8'};
}
function wtKey(idx){return S.gainsMode?`ex${idx}_wtg`:`ex${idx}_wt`}
function getWeight(day,idx){
  const log=getLog();const k=wtKey(idx);if(log[k]!==undefined)return log[k];
  const ex=getEffEx(day,idx);const last=getLastSession(day);
  if(last&&last.log[k]!==undefined)return last.log[k];
  if(S.gainsMode){
    // Suggest a heavier weight based on normal-mode (10-12 rep) history, ~15% up, rounded to 2.5
    const normalWt=(last&&last.log[`ex${idx}_wt`]!==undefined)?last.log[`ex${idx}_wt`]:ex.dw;
    return Math.min(52.5,Math.round((normalWt*1.15)/2.5)*2.5);
  }
  return ex.dw;
}
function getPrevInfo(day,idx){
  const last=getLastSession(day);if(!last)return null;
  const k=wtKey(idx);const ll=last.log;if(ll[k]===undefined)return null;
  return{wt:ll[k],feel:ll[`ex${idx}_feel${S.gainsMode?'g':''}`]||null,reps:ll[`ex${idx}_reps${S.gainsMode?'g':''}`]||null};
}
function getElapsed(){
  const sess=S.activeSession;if(!sess)return 0;
  if(!sess.timerStart)return sess.timerElapsed||0;
  return(sess.timerElapsed||0)+Math.floor((Date.now()-sess.timerStart)/1000);
}
function fmt(sec){return`${Math.floor(sec/60).toString().padStart(2,'0')}:${(sec%60).toString().padStart(2,'0')}`}
function fmtDate(iso){const d=new Date(iso);return d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}
function isToday(iso){const d=new Date(iso);const n=new Date();return d.toDateString()===n.toDateString()}
function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
// Weight steps: 2.5 lb increments, max 52.5
function stepWeight(cur,dir){const n=Math.round((cur+dir*2.5)*10)/10;return Math.min(52.5,Math.max(2.5,n))}

// ─── RENDER ───────────────────────────────────────────────────────────────────

}

  workout.exercises.forEach((baseEx,i)=>{
    const ex=getEffEx(day,i);const done=!!log[`ex${i}_done`];const sets=log[`ex${i}_sets`]||Array(baseEx.sets).fill(false);
    const isOpen=S.openEx===i;const isSwapOpen=S.openSwap===i;const wt=getWeight(day,i);

function renderWeightTracker(){
  const logs=(S.weightLogs||[]).slice().sort((a,b)=>new Date(a.date)-new Date(b.date));
  const recent=logs.slice(-20);
  let html=`<div class="start-card">
    <div style="font-family:'Bebas Neue',cursive;font-size:1.5rem;letter-spacing:2px;margin-bottom:4px">Weight Log</div>
    <div style="font-size:0.7rem;color:var(--accent2);letter-spacing:3px;text-transform:uppercase;margin-bottom:16px">Quick trend tracking</div>
    <div style="display:flex;gap:8px;margin-bottom:10px">
      <input id="wtInput" type="number" step="0.1" placeholder="Weight (lbs)" style="flex:1;padding:10px;background:var(--surface2);border:1px solid var(--border);border-radius:3px;color:var(--text);font-size:0.9rem">
    </div>
    <textarea id="wtNote" class="data-import" style="min-height:44px;margin-bottom:10px" placeholder="Optional note..."></textarea>
    <button onclick="logWeight()" style="width:100%;padding:12px;background:var(--accent);border:none;font-family:'Bebas Neue',cursive;font-size:1.2rem;letter-spacing:2px;cursor:pointer;border-radius:2px;color:#0f0f0f">LOG WEIGHT</button>
  </div>`;

  if(recent.length>=2){
    html+=`<div class="start-card">${sparkline(recent)}</div>`;
  }

  html+=`<div class="sec-hdr">History</div>`;
  if(!logs.length){
    html+=`<div style="padding:20px;text-align:center;color:var(--muted);font-size:0.85rem">No entries yet — log your first weigh-in above.</div>`;
  } else {
    logs.slice().reverse().slice(0,25).forEach((l,idx,arr)=>{
      const olderIdx=logs.findIndex(x=>x.id===l.id)-1;
      const prev=olderIdx>=0?logs[olderIdx]:null;
      const delta=prev?Math.round((l.weight-prev.weight)*10)/10:null;
      const deltaTxt=delta===null?'':delta===0?'· No change':delta>0?`· +${delta} lbs`:`· ${delta} lbs`;
      const deltaColor=delta>0?'var(--red-b)':delta<0?'var(--green-b)':'var(--muted)';
      html+=`<div class="hist-session"><div class="hist-hdr" style="cursor:default;border-bottom:none">
        <div><div class="hist-date">${fmtDate(l.date)}</div><div class="hist-meta" style="color:${deltaColor}">${l.weight} lbs ${deltaTxt}</div></div>
        <button onclick="deleteWeight('${l.id}')" style="background:transparent;border:none;color:var(--muted);font-size:0.8rem;cursor:pointer">✕</button>
      </div>${l.note?`<div style="padding:0 14px 12px;font-size:0.75rem;color:var(--muted)">${escHtml(l.note)}</div>`:''}</div>`;
    });
  }
  return html;
}
function sparkline(entries){
  const w=280,h=70,pad=8;
  const vals=entries.map(e=>e.weight);
  const min=Math.min(...vals),max=Math.max(...vals);
  const range=(max-min)||1;
  const pts=entries.map((e,i)=>{
    const x=pad+(i/(entries.length-1))*(w-pad*2);
    const y=h-pad-((e.weight-min)/range)*(h-pad*2);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  return `<div style="font-size:0.68rem;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:8px">Last ${entries.length} entries · ${min}–${max} lbs</div>
    <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block">
      <polyline points="${pts}" fill="none" stroke="#e8ff47" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    </svg>`;
}
function logWeight(){
  const val=parseFloat(document.getElementById('wtInput').value);
  if(!val||val<=0){alert('Enter a valid weight first.');return}
  const note=document.getElementById('wtNote').value.trim();
  if(!S.weightLogs)S.weightLogs=[];

  save();render();
}

  const active=S.bodyIndexFilter;
  let html=`<div class="start-card">
    <div style="font-family:'Bebas Neue',cursive;font-size:1.5rem;letter-spacing:2px;margin-bottom:4px">Body Index</div>
    <div style="font-size:0.7rem;color:var(--accent2);letter-spacing:3px;text-transform:uppercase;margin-bottom:14px">Tap a muscle group to see every exercise that hits it</div>
    <div style="display:flex;flex-wrap:wrap">
      ${Object.keys(MUSCLE_GROUPS).map(g=>rbtnHtml(g,active===g,`setBodyFilter('${g}')`,'flex:none;padding:9px 13px;margin:0 6px 6px 0')).join('')}
    </div>
  </div>`;
  if(!active)return html;

  const results=[];
  ['push','pull','legs'].forEach(day=>{
    DB[day].exercises.forEach(ex=>{
      if(exerciseGroups(ex.muscles).includes(active)){
        results.push({day,name:ex.name,sets:ex.sets,reps:ex.reps,muscles:ex.muscles,type:'Primary'});
      }
      (DB[day].swaps[ex.id]||[]).forEach(s=>{
        if(exerciseGroups(s.muscles).includes(active)){
          results.push({day,name:s.name,sets:ex.sets,reps:s.reps,muscles:s.muscles,type:`Swap for ${ex.name}`});
        }
      });
    });
  });

  html+=`<div class="sec-hdr">${active} · ${results.length} exercise${results.length===1?'':'s'}</div>`;
  const dayLabel={push:'Push',pull:'Pull',legs:'Legs'};
  const dayColor={push:'var(--accent2)',pull:'var(--blue-b)',legs:'var(--green-b)'};
  results.forEach(r=>{
    html+=`<div class="ex-card"><div class="ex-hdr" style="cursor:default">
      <div class="ex-inf">
        <div class="ex-name">${r.name} <span style="font-size:0.6rem;color:${dayColor[r.day]}">${dayLabel[r.day]}</span></div>
        <div class="ex-meta">${r.sets} sets × ${r.reps}${r.muscles?` · ${r.muscles.join(' · ')}`:''}</div>
      </div>
      <div class="ex-tag">${r.type==='Primary'?'Main Lift':'Swap'}</div>
    </div></div>`;
  });
  return html;
}
function setBodyFilter(g){S.bodyIndexFilter=S.bodyIndexFilter===g?null:g;save();render()}

// ─── INTERACTIONS ─────────────────────────────────────────────────────────────
function selectDay(d){S.currentDay=d;S.view='workout';S.openEx=null;S.openSwap=null;S.openBonus=null;save();render()}

function setView(v){S.view=v;S.openHistIdx=null;save();render()}
function beginSession(day){
  S.activeSession={day,date:new Date().toISOString(),sessionId:Date.now().toString(),readiness:S._pr||null,timerStart:Date.now(),timerElapsed:0,log:{},bonusDone:null};
  S._pr=null;save();render();
}
function toggleEx(i){S.openEx=S.openEx===i?null:i;S.openSwap=null;render()}
function adjWt(i,dir){const w=stepWeight(getWeight(S.currentDay,i),dir);setLog(wtKey(i),w);render()}
function setFeel(i,f){const k=`ex${i}_feel${S.gainsMode?'g':''}`;const cur=getLog()[k];setLog(k,cur===f?null:f);render()}
function setReps(i,r){const k=`ex${i}_reps${S.gainsMode?'g':''}`;const cur=getLog()[k];setLog(k,cur===r?null:r);render()}
function doSwap(i,sid){setLog(`ex${i}_swap`,sid);setLog(wtKey(i),undefined);S.openSwap=null;render()}
function resetSwap(i){setLog(`ex${i}_swap`,'_base_');setLog(wtKey(i),undefined);S.openSwap=null;render()}
function setDefaultSwap(day,baseId,sid){
  if(!S.defaultSwaps)S.defaultSwaps={};if(!S.defaultSwaps[day])S.defaultSwaps[day]={};
  S.defaultSwaps[day][baseId]=sid;save();
}
function clearDefaultSwap(day,baseId){
  if(S.defaultSwaps&&S.defaultSwaps[day])delete S.defaultSwaps[day][baseId];save();
}
function toggleGains(){S.gainsMode=!S.gainsMode;save();render()}
function toggleSet(i,si){
  const ex=DB[S.currentDay].exercises[i];const sets=getLog()[`ex${i}_sets`]||Array(ex.sets).fill(false);
  sets[si]=!sets[si];setLog(`ex${i}_sets`,sets);
  if(getWeight(S.currentDay,i)>0)setLog(wtKey(i),getWeight(S.currentDay,i));
  render();
}
function markDone(i){
  const ex=DB[S.currentDay].exercises[i];
  // Snapshot the weight actually used, even if it was never touched (fixes weight memory not carrying over)
  if(getWeight(S.currentDay,i)>0)setLog(wtKey(i),getWeight(S.currentDay,i));
  setLog(`ex${i}_done`,true);setLog(`ex${i}_sets`,Array(ex.sets).fill(true));
  S.openEx=null;S.openSwap=null;render();
}
function toggleBonus(id){S.openBonus=S.openBonus===id?null:id;render()}
function logBonus(id){if(S.activeSession){S.activeSession.bonusDone=id;save();}S.openBonus=null;render()}
function finishSession(){
  const sess=S.activeSession;if(!sess)return;
  sess.timerElapsed=getElapsed();sess.duration=sess.timerElapsed;sess.timerStart=null;
  if(!S.sessions)S.sessions=[];S.sessions.push({...sess});S.activeSession=null;save();render();
}
function toggleTimer(){
  const sess=S.activeSession;if(!sess)return;
  if(sess.timerStart){sess.timerElapsed=getElapsed();sess.timerStart=null;clearInterval(timerIv);timerIv=null;}
  else{sess.timerStart=Date.now();startTick();}
  save();render();
}
function startTick(){
  clearInterval(timerIv);
  if(!S.activeSession||!S.activeSession.timerStart)return;
  timerIv=setInterval(()=>{
    const el=document.getElementById('timerDisp');const badge=document.getElementById('sessionBadge');const sess=S.activeSession;
    if(!el||!sess){clearInterval(timerIv);return;}
    const e=getElapsed();el.textContent=fmt(e);el.className='timer-disp'+(e>=25*60?' warn':'');
    if(badge)badge.textContent=`${sess.day.toUpperCase()} · ${fmt(e)}`;
  },1000);
}
function copyData(){
  navigator.clipboard.writeText(JSON.stringify(S)).then(()=>alert('Copied!')).catch(()=>{
    const ta=document.createElement('textarea');ta.value=JSON.stringify(S);document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);alert('Data copied!');
  });
}
function importData(){
  const raw=document.getElementById('importArea').value.trim();
  try{const p=JSON.parse(raw);if(!p.sessions)throw new Error();S=p;localStorage.setItem(SK,JSON.stringify(S));alert('Restored!');render();}
  catch{alert('Invalid data — make sure you pasted the full exported text.');}
}
render();
</script>
</body>
</html>
